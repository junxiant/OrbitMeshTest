[tool.ruff]
target-version = "py311"
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "venv",
    "data",
    "logs",
    "eval_results",
]

[tool.ruff.lint]
ignore = [
    "E501",
    "F841",
    "F401",
    "UP",
    "BLE",
    "I",
    "RUF",
    "S",
    "SIM",
    "C",
    "EXE",
]
