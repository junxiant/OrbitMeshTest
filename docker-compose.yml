services:
  qdrant:
    build:
      context: .
      dockerfile: infra/qdrant/Dockerfile
      args:
        QDRANT_VERSION: ${QDRANT_VERSION:-v1.14.1}
    image: orbitmesh-qdrant:local
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbitmesh}
      POSTGRES_USER: ${POSTGRES_USER:-orbitmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbitmesh}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbitmesh} -d ${POSTGRES_DB:-orbitmesh}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web interface for PostgreSQL
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: orbitmesh-backend:local
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - QDRANT_URL=http://qdrant:6333
      - DB_BACKEND=postgres
      - DATABASE_URL=postgresql://${POSTGRES_USER:-orbitmesh}:${POSTGRES_PASSWORD:-orbitmesh}@postgres:5432/${POSTGRES_DB:-orbitmesh}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LLM_MODE=${LLM_MODE:-mock}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: orbitmesh-frontend:local
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  qdrant_data:
  postgres_data:
